plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sahlabu.community'
    compileSdk 37

    defaultConfig {
        applicationId 'com.sahlabu.community'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
